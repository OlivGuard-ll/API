<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    var parametro = new URLSearchParams(window.location.search)
    var sensorId = Number(parametro.get('id'))
    console.log(sensorId)

    let proximaAtualizacao;
    let proximaAtualizacaoBar;

    function iniciarPagina(){
        exibirAquariosDoUsuario();
        exibirAquariosDoUsuarioBar();
        umidadeAtual();
        umidadeMediaDia();
        mediaUmidadeMes();
    }
    var idSensorCerto = 0
    function exibirAquariosDoUsuario() {  
        debugger
        var aquarios = JSON.parse(sessionStorage.SENSOR);
        aquarios.forEach(item => {
                if(sensorId == item.idSensor){
                    idSensorCerto = Number(item.idSensor)
                    document.getElementById("line").innerHTML += `
                        <div id="grafico${item.idSensor}" class="display-none container-grafico">
                            <h3 class="tituloGraficos">
                                <span id="tituloAquario${item.idSensor}">Umidade do solo atual:</span>
                            </h3>
                            <div class="graph">
                                <canvas id="myChartCanvas${item.idSensor}"></canvas>
                            </div>
                        </div>
                    `
                    obterDadosGrafico(item.idSensor)

            }
           
        });
        if (aquarios.length > 0) {
            exibirAquario(sensorId)
        }
    }
    
    // function alterarTitulo(idAquario) {
    //     var tituloAquario = document.getElementById(`tituloAquario${idAquario}`)
    //     var descricao = JSON.parse(sessionStorage.SENSOR).find(item => item.idSensor == idAquario).tipoLeitura;
    //     tituloAquario.innerHTML = "Últimas medidas de <span style='color: #e6005a'>" + descricao + "</span>"
    // }

    function exibirAquario(idAquario) {
        debugger    
        let todosOsGraficos = JSON.parse(sessionStorage.SENSOR);
        for (i = 0; i < todosOsGraficos.length; i++) {
            if (todosOsGraficos[i].idSensor == idAquario) {
                let elementoAtual = document.getElementById(`grafico${todosOsGraficos[i].idSensor}`)
                if (elementoAtual.classList.contains("display-block")) {
                    elementoAtual.classList.remove("display-block")
                }
                elementoAtual.classList.add("display-none")
            }
        }

        let graficoExibir = document.getElementById(`grafico${idAquario}`)
        graficoExibir.classList.remove("display-none")
        graficoExibir.classList.add("display-block")

    }

    function obterDadosGrafico(idAquario) {
        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/medidas/ultimas/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGrafico(resposta, idAquario);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }
    function plotarGrafico(resposta, idAquario) {

        console.log('iniciando plotagem do gráfico...');
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Umidade',
                data: [],
                fill: false,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1
            }],
        };

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.dtLeitura_grafico);
            dados.datasets[0].data.push(registro.leitura);
        }

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'line',
            data: dados,
            options:{devicePixelRatio: 3}
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById(`myChartCanvas${idAquario}`),
            config
        );
        

        setTimeout(() => atualizarGrafico(idAquario, dados, myChart), 2000);
    }


    // Esta função *atualizarGrafico* atualiza o gráfico que foi renderizado na página,
    // buscando a última medida inserida em tabela contendo as capturas, 

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models

    function atualizarGrafico(idAquario, dados, myChart) {
        fetch(`/medidas/tempo-real/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {
                    obterdados(idAquario);
                    // alertar(novoRegistro, idAquario);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);

                    // let avisoCaptura = document.getElementById(`avisoCaptura${idAquario}`)
                    // avisoCaptura.innerHTML = ""

                    if (novoRegistro[0].dtLeitura_grafico == dados.labels[dados.labels.length - 1]) {
                        console.log("---------------------------------------------------------------")
                        console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                        console.log("Horário do novo dado capturado:")
                        console.log(novoRegistro[0].dtLeitura_grafico)
                        console.log("Horário do último dado capturado:")
                        console.log(dados.labels[dados.labels.length - 1])
                        console.log("---------------------------------------------------------------")
                    } else {
                        // tirando e colocando valores no gráfico
                        dados.labels.shift(); // apagar o primeiro
                        dados.labels.push(novoRegistro[0].dtLeitura_grafico); // incluir um novo momento

                        dados.datasets[0].data.shift();  // apagar o primeiro de umidade
                        dados.datasets[0].data.push(novoRegistro[0].leitura); // incluir uma nova medida de umidade

                        myChart.update();
                    }

                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(idAquario, dados, myChart), 2000);
                    umidadeAtual()
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => atualizarGrafico(idAquario, dados, myChart), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }



    function exibirAquariosDoUsuarioBar() {  
        var aquarios = JSON.parse(sessionStorage.SENSOR);
        aquarios.forEach(item => {
            if(sensorId == item.idSensor){
                document.getElementById("bar").innerHTML = `
                    <div id="graficoBarra${item.idSensor}" class="display-none container-grafico">
                        <h3 class="tituloGraficos">
                            <span id="tituloAquario${item.idSensor}">Umidade do solo (Últimos 30 dias)</span>
                        </h3>
                        <div class="graphBar">
                            <canvas id="myChartCanvasBar${item.idSensor}" class="grafico"></canvas>
                        </div>
                    </div>
                `
                obterDadosGraficoBar(item.idSensor)
            }
        });

        if (aquarios.length > 0) {
            exibirAquarioBar(sensorId)
        }
    }

    function exibirAquarioBar(idAquario) {
        let todosOsGraficos = JSON.parse(sessionStorage.SENSOR);
        for (i = 0; i < todosOsGraficos.length; i++) {
            if (todosOsGraficos[i].idSensor == idAquario) {
                let elementoAtual = document.getElementById(`graficoBarra${todosOsGraficos[i].idSensor}`)
                if (elementoAtual.classList.contains("display-block")) {
                    elementoAtual.classList.remove("display-block")
                }
                elementoAtual.classList.add("display-none")
            }
        }

        let graficoExibir = document.getElementById(`graficoBarra${idAquario}`)
        graficoExibir.classList.remove("display-none")
        graficoExibir.classList.add("display-block")

    }

    // O gráfico é construído com três funções:
    // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
    // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
    // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

    function obterDadosGraficoBar(idAquario) {
        if (proximaAtualizacaoBar != undefined) {
            clearTimeout(proximaAtualizacaoBar);
        }
        fetch(`/dashboard/ultimaLeitura/${idAquario}`,{
            method: "GET",
            headers: {"Content-Type": "application/json"}
        })
        .then(res => res.json())
        .then(function (resposta) {
            plotarGraficoBar(resposta, idAquario);
        })
    }
    function plotarGraficoBar(resposta, idAquario) {
        let labels = [];

        let dados = {
            labels: labels,
            datasets: [{
                label: 'Umidade',
                data: [],
                fill: false,
                borderColor: 'rgb(75, 192, 192)',
                backgroundColor: ['#fca311'],  
                barThickness: 12,
                tension: 0.1
            }],
        };

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = resposta.length - 1; i >= 0 ; i--){
            var registro = resposta[i];
            labels.push(registro.dataDaLeitura);
            dados.datasets[0].data.push(registro.mediaDoDia);
        }

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'bar',
            data: dados,
            responsive: true,
            options:{devicePixelRatio: 3}
        };  

        let myChartBar = new Chart(
            document.getElementById(`myChartCanvasBar${idAquario}`),
            config
        );
        setTimeout(() => atualizarGraficoBar(idAquario, dados, myChartBar), 2000);

    }

    function atualizarGraficoBar(idAquario, dados, myChartBar) {
        fetch(`/dashboard/ultimaLeituraTempoReal/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    obterdados(idAquario);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);

                    if (novoRegistro[0].dataDaLeitura == dados.labels[dados.labels.length - 1]) {
                        // se for igual não faz nada.
                    } else {
                    
                        dados.labels.shift(); // apagar o primeiro
                        dados.labels.push(novoRegistro[0].dataDaLeitura); // incluir um novo momento

                        dados.datasets[0].data.shift();  // apagar o primeiro de umidade
                        dados.datasets[0].data.push(novoRegistro[0].mediaDoDia); 

                        myChartBar.update();
                    }

                    proximaAtualizacaoBar = setTimeout(() => atualizarGraficoBar(idAquario, dados, myChartBar), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacaoBar = setTimeout(() => atualizarGraficoBar(idAquario, dados, myChartBar), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }




    function umidadeAtual(){
        fetch(`/dashboard/umidadeAtual/${idSensorCerto}`, {
            method: 'GET'
        }).then(res => res.json())
            .then(function (resposta){
                var umidade = document.getElementById('umidadeAtual')
                umidade.innerHTML = `Umidade atual: ${resposta[0].leitura}%`
                    var dadoAtual = resposta[0].leitura;
                    umidade.classList.remove('atencao','alerta','ideal');
                    
                    if(dadoAtual < 50 || dadoAtual > 80){
                            umidade.classList.add('atencao');
                        }else if(dadoAtual <= 55 || dadoAtual >= 75){
                                umidade.classList.add('alerta');
                            }else{
                                    umidade.classList.add('ideal');
                                }
                                
                situacaoAtual1(dadoAtual)
            var localInstalacao = document.getElementById('setor');
            setor.innerHTML = `Setor: ${resposta[0].setor}`
            })
    }
     function situacaoAtual1(dadoAtual){
        var situcao = document.getElementById('situacaoAtual');
        situcao.classList.remove('atencao','alerta','ideal');
        
        if(dadoAtual < 50 || dadoAtual > 80){
            situcao.innerHTML = 'Situação atual: Alerta'
            situacaoAtual.classList.add('atencao');
        }else if(dadoAtual <= 55 || dadoAtual >= 75){
            situcao.innerHTML = 'Situação atual: Atenção'
            situacaoAtual.classList.add('alerta');
        }else{
            situcao.innerHTML = 'Situação atual: Ideal'
            situacaoAtual.classList.add('ideal');
        }
    }


    function umidadeMediaDia(){
        fetch(`/dashboard/umidadeMediaDia/${idSensorCerto}`, {
            method: 'GET'
        }).then(res => res.json())
        .then(function (resposta){
            var mediaDoDia = document.getElementById('mediaDoDia');
            mediaDoDia.innerHTML = `Umidade média do dia: ${resposta[0].media}%`
            var dadoAtual = resposta[0].media;
            mediaDoDia.classList.remove('atencao','alerta','ideal');
        
        if(dadoAtual < 50 || dadoAtual > 80){
            mediaDoDia.classList.add('atencao');
        }else if(dadoAtual <= 55 || dadoAtual >= 75){
            mediaDoDia.classList.add('alerta');
        }else{
            mediaDoDia.classList.add('ideal');
        }
        })
    }

    
    function mediaUmidadeMes(){
        fetch(`/dashboard/mediaUmidadeMes/${idSensorCerto}`, {
            method: 'GET'
        }).then(res => res.json())
        .then(function (resposta){
            var mediaTrintaDias = document.getElementById('mediaTrintaDias');
            mediaTrintaDias.innerHTML = `Media últimos 30 dias: ${resposta[0].mediaUltimoTrintaDias}%`          
            var dadoAtual = resposta[0].mediaUltimoTrintaDias;   
            mediaTrintaDias.classList.remove('atencao','alerta','ideal');     
        if(dadoAtual < 50 || dadoAtual > 80){
            mediaTrintaDias.classList.add('atencao');
        }else if(dadoAtual <= 55 || dadoAtual >= 75){
            mediaTrintaDias.classList.add('alerta');
        }else{
            mediaTrintaDias.classList.add('ideal');
        }
        })
    }
