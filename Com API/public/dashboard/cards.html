<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function exibirAquarios() {
        let sensores = JSON.parse(sessionStorage.SENSOR);
        let idEmpresa = sensores[0].fkEmpresa;

        fetch(`/dashboard/ultimaLeituraTempoRealCard/${idEmpresa}`, {
            method: 'GET'
        })
            .then(res => {
                return res.json();
            }).then(data => {
                const container = document.getElementById("cardAquarios");
                container.innerHTML = "";

                data.forEach(item => {
                    container.innerHTML += `
            <a href="dashboard.html?id=${item.idSensor}" class="cardAquario">
                <div id="cardAquario_${item.idSensor}" class="cardAquario_id">
                        <div class="title-aquario">
                            <h1 id="leituraSensor_${item.idSensor}">${item.leitura}%</h1>
                        </div>
                        <div class="desc-aquario">
                            <div class="temperatura">
                                <p id="idSensor_${item.idSensor}">Sensor (Setor: ${item.localInstalacao})</p>
                            </div>
                            <div class="cor-alerta" id="card_${item.idSensor}"></div>
                        </div>
                </div>
            </a>`;
                    let leitura = Number(item.leitura);
                    situacaoAtual(leitura, item.idSensor);
                });
                setTimeout(() => exibirAquarios(), 2000);
            })
            .catch(err => {
                console.error("Erro ao buscar leituras:", err);
            });


        function situacaoAtual(leitura, idSensor) {
            const situacao = document.getElementById(`cardAquario_${idSensor}`);
            if (leitura < 50) {
                situacao.classList.add('atencao');
            } else if (leitura > 80) {
                situacao.classList.add('atencao');
            } else if (leitura >= 55 && leitura <= 75) {
                situacao.classList.add('ideal');
            } else {
                situacao.classList.add('alerta');
            }
        }
    }
</script>
