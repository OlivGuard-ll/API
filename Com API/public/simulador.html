
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador Financeiro - OlivGuard</title>
  <link rel="stylesheet" href="./css/simulador.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header>
    <a href="index.html">
      <img src="../assets/img/logoOlivGuard 1.png" alt="Logo OlivGuard" />
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="simulador.html">Simulador Financeiro</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>OlivGuard - Simulador financeiro</h1>

    <div class="pergunta">
      Quantos <b>Hectares</b> sua plantação de oliva possui?
      <input type="text" id="input_qtdHectares" placeholder="Digite a quantidade" />
    </div>

    <div class="pergunta">
      Qual sua <b>Meta de Produção</b> para esse ano?
      <input type="text" id="input_metaProd" placeholder="Digite a meta (Toneladas)" />
    </div>

    <div class="pergunta">
      Qual o <b>Valor da Tonelada</b> do seu produto?
      <input type="text" id="input_valorKg" placeholder="Digite o valor da Tonelada (R$)" />
    </div>

    <div class="pergunta botao">
      Qual a <b>Porcentagem de Perda</b> da sua plantação?
      <input type="text" id="input_perda" placeholder="Digite a porcentagem (%)" />
      <button onclick="calcular()">Calcular Produção</button>
    </div>

    <div id="res"></div>
    <div id="res2"></div>
  </main>

  <script>
    function calcular() {
      const hectares = Number(document.getElementById('input_qtdHectares').value);
      const producaoToneladas = Number(document.getElementById('input_metaProd').value);
      const precoTonelada = Number(document.getElementById('input_valorKg').value);
      const perda = Number(document.getElementById('input_perda').value);
      const perdaDecimal = perda / 100;

      if (
        isNaN(hectares) || hectares <= 0 ||
        isNaN(producaoToneladas) || producaoToneladas <= 0 ||
        isNaN(precoTonelada) || precoTonelada <= 0 ||
        isNaN(perda) || perda < 0
      ) {
        alert("Informe valores válidos nos campos!");
        document.getElementById('res').style.display = "none";
        document.getElementById('res2').style.display = "none";
        return;
      }

      const producaoFinal = producaoToneladas * (1 - perdaDecimal);
      const ganhoSemProjeto = producaoFinal * precoTonelada;
      const producaoFinalHectares = (producaoToneladas / hectares) * (1 - perdaDecimal);

      const producaoFinalProjeto = producaoToneladas * (1 - perdaDecimal / 2);
      const ganhoComProjeto = producaoFinalProjeto * precoTonelada;
      const producaoFinalProjetoHectares = (producaoToneladas / hectares) * (1 - perdaDecimal / 2);

      let classificacaoSemProjeto = "";
      if (producaoFinalHectares < 3) classificacaoSemProjeto = "Baixo Rendimento";
      else if (producaoFinalHectares < 6) classificacaoSemProjeto = "Rendimento Médio";
      else if (producaoFinalHectares < 10) classificacaoSemProjeto = "Bom Rendimento";
      else classificacaoSemProjeto = "Excelente Rendimento";

      let classificacao = "";
      if (producaoFinalProjetoHectares < 3) classificacao = "Baixo Rendimento";
      else if (producaoFinalProjetoHectares < 6) classificacao = "Rendimento Médio";
      else if (producaoFinalProjetoHectares < 10) classificacao = "Bom Rendimento";
      else classificacao = "Excelente Rendimento";

      const res = document.getElementById('res');
      const res2 = document.getElementById('res2');

      res.innerHTML = `
        <table border="1" cellpadding="10" cellspacing="0">
          <thead>
            <tr>
              <th>Indicador</th>
              <th>Sem OlivGuard</th>
              <th>Com OlivGuard</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="tooltip" data-tooltip="Indicador da produção final em toneladas após perdas."><strong>Produção Final</strong></td>
              <td class="tooltip" data-tooltip="Produção total estimada após perdas, sem usar o sistema OlivGuard.">${producaoFinal.toFixed(2)} t</td>
              <td class="tooltip" data-tooltip="Produção total estimada após perdas, usando o sistema OlivGuard, que reduz perdas pela metade.">${producaoFinalProjeto.toFixed(2)} t</td>
            </tr>
            <tr>
              <td class="tooltip" data-tooltip="Valor estimado do ganho financeiro com a produção."><strong>Ganho Estimado</strong></td>
              <td class="tooltip" data-tooltip="Ganho financeiro estimado sem a tecnologia OlivGuard, calculado pela produção final vezes o preço da tonelada.">${ganhoSemProjeto.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</td>
              <td class="tooltip" data-tooltip="Ganho financeiro estimado com a tecnologia OlivGuard, considerando menor perda.">${ganhoComProjeto.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</td>
            </tr>
            <tr>
              <td class="tooltip" data-tooltip="Produção média por hectare, indicador de produtividade da plantação."><strong>Produção por Hectare</strong></td>
              <td class="tooltip" data-tooltip="Sem tecnologia, a produtividade por hectare foi de ${producaoFinalHectares.toFixed(2)} t/ha. Isso indica um rendimento ${classificacaoSemProjeto.toLowerCase()}">
                ${producaoFinalHectares.toFixed(2)} t/ha
              </td>
              <td class="tooltip" data-tooltip="Com a tecnologia OlivGuard, a produtividade aumentou para ${producaoFinalProjetoHectares.toFixed(2)} t/ha, elevando a classificação para ${classificacao.toLowerCase()}">
                ${producaoFinalProjetoHectares.toFixed(2)} t/ha
              </td>
            </tr>
            <tr>
              <td class="tooltip" data-tooltip="Porcentagem de perda estimada da produção devido a fatores naturais ou operacionais."><strong>Perda da Produção</strong></td>
              <td class="tooltip" data-tooltip="Percentual de perda informado pelo usuário, sem intervenção do sistema OlivGuard.">${perda}%</td>
              <td class="tooltip" data-tooltip="Perda reduzida pela metade com o uso da tecnologia OlivGuard.">${(perda / 2).toFixed(2)}%</td>
            </tr>
            <tr>
              <td class="tooltip" data-tooltip="Classificação qualitativa da produtividade com base na produção por hectare."><strong>Classificação</strong></td>
              <td class="tooltip" data-tooltip="Classificação da produção sem o sistema OlivGuard, baseada na produtividade por hectare.">${classificacaoSemProjeto}</td>
              <td class="tooltip" data-tooltip="Classificação da produção com o sistema OlivGuard, mostrando a melhora de rendimento.">${classificacao}</td>
            </tr>
          </tbody>
        </table>
      `;

      res2.innerHTML = `
        <b>Classificação Qualitativa:</b><br>
        Baixo Rendimento: Menos de 3 t/ha<br>
        Rendimento Médio: Entre 3 e 6 t/ha<br>
        Bom Rendimento: Entre 6 e 10 t/ha<br>
        Excelente Rendimento: Acima de 10 t/ha <br><br>
        Fonte: Incaper (Instituto Capixaba de Pesquisa, Assistência Técnica e Extensão Rural)
      `;

      res.style.display = "block";
      res2.style.display = "block";
    }

  </script>
</body>

</html>
