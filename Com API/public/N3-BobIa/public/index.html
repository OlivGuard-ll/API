<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="shortcut icon" type="imagex/png" href="../assets/icons/icons8-oliva-50.png" />

</head>
<body>

    <div id="container">
        <h1>BobIA</h1>
        <h2>Olá N3, seja bem vindo!</h2>
        <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
        <button onclick="gerarResposta()">Gerar Resposta <img src="./add.svg" alt="" srcset=""></button>
        <h2>Resposta da IA:</h2>
        <div id="resposta">aaaaaaaaaaaaa</div>
    </div>

    <script>
        
        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
    
</body>
</html>
